<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spice Lick LLC — YouTube banner (2560×1440)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1a18; --paper:#f4f1eb; --accent:#3d6b4f; --muted:#8a8578; --rule:#d4cfc5; }
  html, body { margin:0; padding:0; width:2560px; height:1440px; overflow:hidden; }
  body { position:relative; background:var(--paper); color:var(--ink); font-family:'DM Sans', sans-serif; }

  /* Full-canvas decorative range (visible on TV; peaks at far left/right peek into the desktop strip) */
  .range { position:absolute; inset:0; width:2560px; height:1440px; color:var(--accent); }

  /* YouTube "safe area": 1546×423 centered — everything important lives here */
  .safe {
    position:absolute; left:507px; top:508px; width:1546px; height:423px;
    display:flex; align-items:center; justify-content:center; gap:84px;
  }
  .mark { display:flex; flex-direction:column; align-items:center; gap:2px; flex-shrink:0; }
  .mark svg { width:372px; height:auto; color:var(--accent); display:block; }
  .motto { font-family:'Caveat', cursive; font-weight:500; font-size:46px; line-height:1.05; color:var(--accent); text-align:center; }

  .vr { width:2px; height:280px; background:var(--rule); flex-shrink:0; }

  .text { display:flex; flex-direction:column; }
  h1 { font-family:'DM Serif Display', serif; font-weight:400; font-size:138px; letter-spacing:-0.02em; line-height:1.08; margin:0 0 14px; white-space:nowrap; }
  .tagline { color:var(--accent); font-weight:500; font-size:33px; letter-spacing:0.07em; line-height:1.2; white-space:nowrap; }
  .meta { margin-top:26px; padding-top:22px; border-top:2px solid var(--rule); color:var(--muted); font-size:30px; letter-spacing:0.02em; line-height:1.2; display:flex; gap:22px; }
  .meta .dot { color:var(--rule); }
</style>
</head>
<body>
  <svg class="range" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <filter id="pencil-lg" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" filter="url(#pencil-lg)" opacity="0.32">
      <!-- main ridgeline: tall at the edges, rolling low through the center -->
      <path stroke-width="4.4" d="M-40 1396 L130 1030 L215 1115 L360 612 L452 900 L545 1012 L705 1180 L905 1118 L1125 1262 L1285 1170 L1480 1282 L1700 1150 L1905 1232 L2030 1005 L2115 878 L2205 598 L2335 1062 L2425 958 L2600 1396"/>
      <!-- faint second pass -->
      <path stroke-width="2.2" opacity="0.55" d="M-38 1393 L131 1038 L218 1118 L360 622 L454 903 L547 1015 L707 1183 L906 1123 L1125 1266 L1286 1174 L1480 1286 L1700 1155 L1905 1236 L2031 1010 L2115 884 L2205 608 L2334 1064 L2426 962 L2598 1393"/>
      <!-- snow-cap hatching on the two tall peaks -->
      <path stroke-width="2.4" opacity="0.7" d="M336 652 L360 612 L384 652"/>
      <path stroke-width="1.8" opacity="0.5" d="M342 664 L354 646 M366 646 L378 664"/>
      <path stroke-width="2.4" opacity="0.7" d="M2181 638 L2205 598 L2229 638"/>
      <path stroke-width="1.8" opacity="0.5" d="M2187 650 L2199 632 M2211 632 L2223 650"/>
      <!-- shading hatch on right flanks -->
      <path stroke-width="1.8" opacity="0.4" d="M2246 704 L2274 744 M2258 690 L2286 730 M2272 718 L2300 758 M2286 746 L2314 786"/>
      <path stroke-width="1.8" opacity="0.4" d="M406 712 L432 752 M418 698 L444 738 M430 730 L456 770"/>
      <!-- ground line -->
      <path stroke-width="3" d="M0 1396 L2560 1396"/>
    </g>
  </svg>

  <div class="safe">
    <div class="mark">
      <svg viewBox="0 0 120 88" role="img" aria-label="Pencil sketch of a mountain" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="7" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#pencil)">
          <path d="M4 84 L34 38 L48 56 L72 14 L92 46 L104 34 L116 84"/>
          <path d="M5 83 L34 41 L49 57 L72 18 L91 47 L104 37 L115 83" stroke-width="0.7" opacity="0.55"/>
          <path d="M64 26 L72 14 L80 26" stroke-width="0.8" opacity="0.7"/>
          <path d="M66 30 L70 25 M74 25 L78 30" stroke-width="0.6" opacity="0.5"/>
          <path d="M78 34 L86 44 M83 32 L90 41 M88 36 L95 45" stroke-width="0.6" opacity="0.4"/>
          <path d="M2 84 L118 84" stroke-width="1"/>
        </g>
      </svg>
      <div class="motto">montani semper liberi</div>
    </div>
    <div class="vr"></div>
    <div class="text">
      <h1>Spice Lick LLC</h1>
      <div class="tagline">SOFTWARE CONSULTING &amp; iOS APP DEVELOPMENT</div>
      <div class="meta"><span>spice-lick.com</span><span class="dot">&middot;</span><span>Summers County, West Virginia</span></div>
    </div>
  </div>
</body>
</html>
