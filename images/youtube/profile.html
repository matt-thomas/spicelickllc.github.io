<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spice Lick LLC — YouTube profile (800×800)</title>
<style>
  :root { --ink:#1a1a18; --paper:#f4f1eb; --accent:#3d6b4f; --rule:#d4cfc5; }
  html, body { margin:0; padding:0; width:800px; height:800px; overflow:hidden; }
  body { background:var(--paper); display:flex; align-items:center; justify-content:center; }
  body.inverse { background:var(--accent); }
  svg { width:540px; height:auto; color:var(--accent); display:block; margin-top:-34px; }
  body.inverse svg { color:var(--paper); }
</style>
</head>
<body class="BODYCLASS">
  <svg viewBox="0 0 120 88" role="img" aria-label="Pencil sketch of a mountain" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#pencil)">
      <path d="M4 84 L34 38 L48 56 L72 14 L92 46 L104 34 L116 84"/>
      <path d="M5 83 L34 41 L49 57 L72 18 L91 47 L104 37 L115 83" stroke-width="0.7" opacity="0.55"/>
      <path d="M64 26 L72 14 L80 26" stroke-width="0.8" opacity="0.7"/>
      <path d="M66 30 L70 25 M74 25 L78 30" stroke-width="0.6" opacity="0.5"/>
      <path d="M78 34 L86 44 M83 32 L90 41 M88 36 L95 45" stroke-width="0.6" opacity="0.4"/>
      <path d="M2 84 L118 84" stroke-width="1"/>
    </g>
  </svg>
</body>
</html>
